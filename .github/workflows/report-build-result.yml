name: Report Build Result

on:
  workflow_run:
    workflows:
      - Build with unit tests
    types:
      - completed

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect triggering workflow metadata
        env:
          EVENT_WORKFLOW: ${{ toJSON(github.event.workflow) }}
          EVENT_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          echo "=== workflow metadata ==="
          printf '%s\\n' "$EVENT_WORKFLOW"
          echo "=== workflow_run metadata ==="
          printf '%s\\n' "$EVENT_WORKFLOW_RUN"

      - name: Write result to test log
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "{ \"repository\": \"${{ github.repository }}\", \"build_name\": \"${{ github.event.workflow.name }}\", \"branch\": \"$HEAD_BRANCH\", \"conclusion\": \"${{ github.event.workflow_run.conclusion }}\" }"

      - name: Check for injection proof
        run: |
          echo "--- checking if pwn_proof.txt exists ---"
          echo "--- actor was: ${{ github.event.workflow_run.actor.login }} ---"
          echo "--- head repo was: ${{ github.event.workflow_run.head_repository.full_name }} ---"
          cat pwn_proof.txt 2>/dev/null || echo "no pwn_proof.txt found (payload did not fire)"
